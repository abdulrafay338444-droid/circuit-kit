[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuitkit"
version = "0.2.0"
description = "A tested toolkit for circuit calculations: DC basics, RC/RL/RLC circuits, AC impedance, op-amp design and E12/E24 resistors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdul" }]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "numpy>=1.24"]
dev = ["pytest>=7"]

[project.scripts]
circuitkit = "circuitkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
